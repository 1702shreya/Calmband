<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CalmBand - Stress Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body {
    background: radial-gradient(circle at top, #1b0034, #000);
    margin: 0;
    color: #fff;
    font-family: Poppins, sans-serif;
    text-align: center;
    padding-bottom: 120px;
    overflow-y: auto;
  }

  /* NAVBAR */
  .navbar {
    background: linear-gradient(90deg, #7f00ff, #00d4ff);
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .navbar .logo { font-size: 26px; font-weight: 700; }
  .navbar ul { list-style: none; display: flex; gap: 24px; margin: 0; padding: 0; }
  .navbar a { color: #fff; text-decoration: none; font-weight: 600; }

  /* DATE RANGE */
  .date-range {
    margin-top: 40px;
    margin-bottom: 30px;
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="date"] {
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #00ffff;
    background: #ffffff;
    color: #000;
    font-weight: 600;
  }

  .btn {
    background: linear-gradient(90deg, #ff00cc, #3333ff);
    padding: 10px 22px;
    border: none;
    border-radius: 20px;
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
  }

  /* OUTPUT BOX */
  .output {
    margin-top: 40px;
    padding: 30px;
    width: 85%;
    max-width: 500px;
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    margin-left: auto;
    margin-right: auto;
  }
  .stress-value {
    font-size: 34px;
    font-weight: 700;
    margin-top: 10px;
    color: #00ffff;
  }
  .message { color: #ffcc66; margin-top: 12px; font-size: 14px; }

  /* CHART SECTION */
  .chart-container {
    width: 90%;
    max-width: 900px;
    margin: 50px auto;
    background: rgba(255,255,255,0.08);
    padding: 25px;
    border-radius: 20px;
  }
  .chart-title {
    font-size: 28px;
    margin-bottom: 20px;
    color: #00ffff;
  }
  
.ai-nav-container { margin: 30px 0; }
  .btn-ai { background: linear-gradient(90deg, #00d4ff, #7f00ff); padding: 15px 30px; border: none; border-radius: 30px; color: white; cursor: pointer; font-weight: 700; font-size: 18px; box-shadow: 0 0 20px rgba(127, 0, 255, 0.5); transition: 0.3s; }
  .btn-ai:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 212, 255, 0.8); }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  
</style>
</head>

<body>
  <div class="navbar">
    <div class="logo">CalmBand</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Analysis</a></li>
    </ul>
  </div>

  <div class="date-range">
    <label>From:</label> <input id="startDate" type="date" />
    <label>To:</label> <input id="endDate" type="date" />
    <button id="showData" class="btn">Show Data</button>
  </div>

  <div class="output" id="outputBox">
    <h2>Average Stress Level</h2>
    <div class="stress-value" id="stressLevel">--</div>
    <div class="message" id="statusMessage">Pick a date range.</div>
  </div>

  <div class="chart-container">
    <div class="chart-title">Stress Level Graph</div>
    <canvas id="stressChart" height="120"></canvas>
  </div>
<div class="ai-nav-container">
    <button class="btn-ai" onclick="window.location.href='assistant.html'">💬 Open AI Assistant</button>
  </div>
  

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ✅ Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDgfFaS48GZrckWpMtPJiWbrwPJs21CmC8",
  authDomain: "calmband-123.firebaseapp.com",
  databaseURL: "https://calmband-123-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "calmband-123",
  storageBucket: "calmband-123.firebasestorage.app",
  messagingSenderId: "341019300256",
  appId: "1:341019300256:web:5842114288fb83872914c5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ✅ Chart
const ctx = document.getElementById("stressChart").getContext("2d");
const stressChart = new Chart(ctx, {
  type: "line",
  data: { labels: [], datasets: [{
    label: "Predicted Stress",
    data: [],
    borderColor: "#00ffff",
    backgroundColor: "rgba(0,255,255,0.15)",
    tension: 0.35,
    pointRadius: 5
  }]},
  options: {
    scales: {
      y: { min: 0, max: 2,
        ticks: { stepSize: 1, callback: v=>v===0?"LOW":v===1?"MEDIUM":"HIGH", color:"#fff" } },
      x: { ticks:{ color:"#fff" } }
    }
  }
});

function showMessage(t,error=false){
  const msg=document.getElementById("statusMessage");
  msg.textContent=t;
  msg.style.color=error?"#ff6666":"#ffcc66";
}
const avgVal = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
function stressText(v){ if(v<0.5) return "Low Stress 🌿"; if(v<1.5) return "Moderate Stress 😌"; return "High Stress ⚠️"; }

// ✅ Random Recommendation arrays

// ✅ Fetch & process data
document.getElementById("showData").onclick = async () => {
  showMessage("Loading...");
  const start=document.getElementById("startDate").value;
  const end=document.getElementById("endDate").value;
  if(!start||!end){ showMessage("Select both dates.",true); return; }

  const snap = await db.ref("CalmBandData/Stress_Level").once("value");
  const data = snap.val();
  if(!data){ showMessage("Node missing!",true); return; }

  const labels=[], values=[], HR=[], TEMP=[], GSR=[];
  Object.keys(data).sort().forEach(k=>{
    const date=k.substring(0,10);
    if(date<start||date>end) return;
    const node=data[k];
    if(node.STRESS===undefined) return;
    labels.push(k.replace("_"," "));
    values.push(Number(node.STRESS));
    if(node.HR) HR.push(Number(node.HR));
    if(node.TEMP) TEMP.push(Number(node.TEMP));
    if(node.GSR) GSR.push(Number(node.GSR));
  });

  if(labels.length===0){ showMessage("No data found in this range.",true); return; }

  stressChart.data.labels=labels;
  stressChart.data.datasets[0].data=values;
  stressChart.update();

  const avg=avgVal(values);
  document.getElementById("stressLevel").innerHTML = stressText(avg);
  showMessage(`Loaded ${labels.length} records | Avg = ${avg.toFixed(2)}`);

  document.getElementById("recommendationList").innerHTML = getRecommendations(avg);
};
</script>
</body>
</html>
